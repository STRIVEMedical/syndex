; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
lib_deps = adafruit/Adafruit BNO08x
build_flags = -I../shared -DHANDLE_ID=0
[env:handle-imu-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -I ../shared
lib_deps = adafruit/Adafruit BNO08x
build_src_filter = -<*> +<imu.cpp> +<../test/imu_test.cpp>

; TEMPORARY: BNO085 UART bring-up diagnostic (remove with test/imu_uart_diag.cpp)
[env:handle-imu-uart-diag]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../test/imu_uart_diag.cpp>

[env:handle-link-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -I../shared
    -DHANDLE_ID=0
    -DLINK_SSID=\"SynDexAP\"
    -DLINK_PASS=\"password\"
build_src_filter = -<*> +<base_link.cpp> +<../test/link_test.cpp>

; Real BNO085 orientation over the UDP link (same network settings as handle-link-test)
[env:handle-imu-link-test]
extends = env:handle-link-test
lib_deps = adafruit/Adafruit BNO08x
build_src_filter = -<*> +<imu.cpp> +<base_link.cpp> +<../test/imu_link_test.cpp>